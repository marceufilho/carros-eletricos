# Compila o artigo e os slides e publica a pasta portal/ no GitHub Pages.
# Requer, uma única vez: Settings > Pages > Source = "GitHub Actions".
name: Site e PDFs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Se o LaTeX falhar, o site é publicado mesmo assim (sem o PDF que falhou);
      # o erro fica visível no log deste passo.
      - name: Compilar o artigo
        id: artigo
        continue-on-error: true
        uses: xu-cheng/latex-action@v3
        with:
          root_file: artigo.tex
          working_directory: artigo

      - name: Compilar os slides
        id: slides
        continue-on-error: true
        uses: xu-cheng/latex-action@v3
        with:
          root_file: slides.tex
          working_directory: slides

      - name: Copiar os PDFs para o site
        run: |
          for f in artigo/artigo.pdf slides/slides.pdf; do
            if [ -f "$f" ]; then cp "$f" portal/; else echo "::warning::$f não foi gerado"; fi
          done

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: portal

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
